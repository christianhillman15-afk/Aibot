<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aibot — Personal AI</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e2229; --border: #2a2f3a;
    --text: #e6e8ee; --dim: #9aa3b2; --accent: #d97a4a; --accent2: #7aa2f7;
    --ok: #7fc98a; --bad: #e06c75;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }

  #sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 700; letter-spacing: .5px; }
  #sidebar header .dot { color: var(--accent); }
  #newChat { margin: 12px; padding: 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2); color: var(--text); cursor: pointer; font-size: 14px; }
  #newChat:hover { border-color: var(--accent); }
  #convList { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .convItem { padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
  .convItem:hover { background: var(--panel2); color: var(--text); }
  .convItem.active { background: var(--panel2); color: var(--text); }
  .convItem .del { margin-left: auto; opacity: 0; font-size: 12px; }
  .convItem:hover .del { opacity: .7; }
  #sidebar footer { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--dim); }
  #sidebar footer a { color: var(--dim); cursor: pointer; text-decoration: underline; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 0 12px; }
  .msg { max-width: 820px; margin: 0 auto 18px; padding: 0 20px; }
  .msg .who { font-size: 12px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: .8px; }
  .msg.user .body { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.assistant .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg .body pre { background: #12141a; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; white-space: pre; font-size: 13px; }
  .thinking { color: var(--dim); font-size: 13px; border-left: 3px solid var(--border); padding: 4px 10px; margin: 6px 0; white-space: pre-wrap; display: none; }
  .thinking.open { display: block; }
  .thinkToggle { font-size: 12px; color: var(--accent2); cursor: pointer; user-select: none; margin: 4px 0; display: inline-block; }
  .chip { display: inline-block; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; margin: 3px 4px 3px 0; color: var(--dim); }
  .chip.ok { border-color: #2e4436; }
  .chip.bad { border-color: #59323a; color: var(--bad); }
  .chip.agent { border-color: #3a3560; color: var(--accent2); }
  .notice { color: var(--accent); font-size: 13px; margin: 6px 0; }
  .errorBox { color: var(--bad); font-size: 13px; margin: 6px 0; white-space: pre-wrap; }
  .usage { color: var(--dim); font-size: 12px; margin-top: 6px; }

  #composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 20px 16px; }
  #composerInner { max-width: 820px; margin: 0 auto; }
  #controls { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  select { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  #ultraWarn { color: var(--accent); display: none; }
  #inputRow { display: flex; gap: 10px; }
  textarea { flex: 1; resize: none; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font: inherit; min-height: 48px; max-height: 200px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  #send { padding: 0 22px; border-radius: 10px; border: none; background: var(--accent); color: #16110c; font-weight: 700; cursor: pointer; font-size: 14px; }
  #send:disabled { opacity: .5; cursor: default; }

  #login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #loginBox { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 28px; width: 360px; }
  #loginBox h1 { font-size: 18px; margin: 0 0 6px; }
  #loginBox p { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
  #loginBox input { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font: inherit; margin-bottom: 12px; }
  #loginBox button { width: 100%; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: #16110c; font-weight: 700; cursor: pointer; }
  #loginErr { color: var(--bad); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>

<div id="login" style="display:none">
  <div id="loginBox">
    <h1>Aibot <span style="color:var(--accent)">●</span></h1>
    <p>Enter the access token from your server's <code>.env</code> file (AUTH_TOKEN).</p>
    <input id="tokenInput" type="password" placeholder="Access token" autocomplete="current-password">
    <div id="loginErr"></div>
    <button id="loginBtn">Unlock</button>
  </div>
</div>

<div id="sidebar">
  <header>Aibot <span class="dot">●</span> <span style="font-weight:400;color:var(--dim);font-size:12px" id="modelLabel"></span></header>
  <button id="newChat">+ New chat</button>
  <div id="convList"></div>
  <footer><a id="logout">Log out</a></footer>
</div>

<div id="main">
  <div id="messages"></div>
  <div id="composer">
    <div id="composerInner">
      <div id="controls">
        <label>Mode
          <select id="mode">
            <option value="standard">Standard</option>
            <option value="ultra">Ultracode (multi-agent)</option>
          </select>
        </label>
        <label>Effort
          <select id="effort">
            <option value="">auto</option>
            <option>low</option><option>medium</option><option>high</option>
            <option>xhigh</option><option>max</option>
          </select>
        </label>
        <span id="ultraWarn">⚠ Ultra mode spawns parallel agents — expect significantly higher token costs.</span>
      </div>
      <div id="inputRow">
        <textarea id="input" placeholder="Message your AI… (Enter to send, Shift+Enter for newline)"></textarea>
        <button id="send">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("aibot_token") || "";
let currentConv = null;
let streaming = false;

// ---------- auth ----------
function headers(json) {
  const h = { "Authorization": "Bearer " + token };
  if (json) h["Content-Type"] = "application/json";
  return h;
}
async function checkAuth() {
  try {
    const r = await fetch("/api/health", { headers: headers() });
    if (r.status === 401) return false;
    const j = await r.json();
    $("modelLabel").textContent = j.model || "";
    return true;
  } catch { return false; }
}
function showLogin(msg) {
  $("login").style.display = "flex";
  $("loginErr").textContent = msg || "";
  $("tokenInput").focus();
}
$("loginBtn").onclick = async () => {
  token = $("tokenInput").value.trim();
  if (await checkAuth()) {
    localStorage.setItem("aibot_token", token);
    $("login").style.display = "none";
    refreshConvList();
  } else {
    showLogin("Invalid token — check AUTH_TOKEN in the server's .env");
  }
};
$("tokenInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
$("logout").onclick = () => { localStorage.removeItem("aibot_token"); location.reload(); };

// ---------- rendering ----------
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderRich(el, text) {
  // minimal markdown: fenced code blocks + inline code; everything else pre-wrap text
  const parts = text.split(/```/);
  let html = "";
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const body = part.replace(/^[a-zA-Z0-9_+-]*\n/, "");
      html += "<pre>" + escapeHtml(body) + "</pre>";
    } else {
      html += escapeHtml(part).replace(/`([^`\n]+)`/g, "<code>$1</code>");
    }
  });
  el.innerHTML = html;
}
function addMsg(role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = '<div class="who">' + (role === "user" ? "You" : "Assistant") + '</div>';
  const body = document.createElement("div");
  body.className = "body";
  div.appendChild(body);
  $("messages").appendChild(div);
  return div;
}
function scrollDown() { $("messages").scrollTop = $("messages").scrollHeight; }

function renderStoredConversation(conv) {
  $("messages").innerHTML = "";
  for (const m of conv.messages) {
    if (m.role === "user") {
      const texts = m.content.filter(b => b.type === "text").map(b => b.text);
      if (texts.length) {
        const el = addMsg("user");
        el.querySelector(".body").textContent = texts.join("\n");
      }
    } else {
      const texts = m.content.filter(b => b.type === "text").map(b => b.text).join("\n");
      const tools = m.content.filter(b => b.type === "tool_use" || b.type === "server_tool_use");
      const el = addMsg("assistant");
      const body = el.querySelector(".body");
      if (tools.length) {
        const chips = document.createElement("div");
        tools.forEach(t => {
          const c = document.createElement("span");
          c.className = "chip"; c.textContent = "🔧 " + t.name;
          chips.appendChild(c);
        });
        body.appendChild(chips);
      }
      if (texts.trim()) {
        const t = document.createElement("div");
        renderRich(t, texts);
        body.appendChild(t);
      }
      if (!tools.length && !texts.trim()) el.remove();
    }
  }
  scrollDown();
}

// ---------- conversations ----------
async function refreshConvList() {
  const r = await fetch("/api/conversations", { headers: headers() });
  if (r.status === 401) return showLogin();
  const list = await r.json();
  const el = $("convList");
  el.innerHTML = "";
  for (const c of list) {
    const item = document.createElement("div");
    item.className = "convItem" + (currentConv === c.id ? " active" : "");
    item.innerHTML = (c.mode === "ultra" ? "⚡ " : "💬 ") + escapeHtml(c.title || "Untitled") +
      '<span class="del" title="Delete">✕</span>';
    item.onclick = () => openConversation(c.id);
    item.querySelector(".del").onclick = async (e) => {
      e.stopPropagation();
      await fetch("/api/conversations/" + c.id, { method: "DELETE", headers: headers() });
      if (currentConv === c.id) { currentConv = null; $("messages").innerHTML = ""; }
      refreshConvList();
    };
    el.appendChild(item);
  }
}
async function openConversation(id) {
  if (streaming) return;
  const r = await fetch("/api/conversations/" + id, { headers: headers() });
  if (!r.ok) return;
  const conv = await r.json();
  currentConv = id;
  $("mode").value = conv.mode === "ultra" ? "ultra" : "standard";
  renderStoredConversation(conv);
  refreshConvList();
}
$("newChat").onclick = () => {
  if (streaming) return;
  currentConv = null;
  $("messages").innerHTML = "";
  refreshConvList();
  $("input").focus();
};

// ---------- chat streaming ----------
$("mode").onchange = () => {
  $("ultraWarn").style.display = $("mode").value === "ultra" ? "inline" : "none";
};

async function send() {
  const text = $("input").value.trim();
  if (!text || streaming) return;
  $("input").value = "";
  streaming = true;
  $("send").disabled = true;

  const userEl = addMsg("user");
  userEl.querySelector(".body").textContent = text;

  const asEl = addMsg("assistant");
  const body = asEl.querySelector(".body");
  const activity = document.createElement("div");
  body.appendChild(activity);

  let thinkBox = null, thinkToggle = null, thinkText = "";
  let answerEl = null, answerText = "";
  const ensureAnswer = () => {
    if (!answerEl) { answerEl = document.createElement("div"); body.appendChild(answerEl); }
    return answerEl;
  };
  const ensureThink = () => {
    if (!thinkBox) {
      thinkToggle = document.createElement("span");
      thinkToggle.className = "thinkToggle";
      thinkToggle.textContent = "▸ thinking";
      thinkBox = document.createElement("div");
      thinkBox.className = "thinking";
      thinkToggle.onclick = () => {
        thinkBox.classList.toggle("open");
        thinkToggle.textContent = (thinkBox.classList.contains("open") ? "▾" : "▸") + " thinking";
      };
      body.insertBefore(thinkBox, activity.nextSibling);
      body.insertBefore(thinkToggle, thinkBox);
    }
    return thinkBox;
  };
  const chip = (label, cls) => {
    const c = document.createElement("span");
    c.className = "chip " + (cls || "");
    c.textContent = label;
    activity.appendChild(c);
    scrollDown();
  };
  const note = (text, cls) => {
    const n = document.createElement("div");
    n.className = cls || "notice";
    n.textContent = text;
    body.appendChild(n);
    scrollDown();
  };

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: headers(true),
      body: JSON.stringify({
        conversationId: currentConv,
        message: text,
        mode: $("mode").value,
        effort: $("effort").value || undefined,
      }),
    });
    if (resp.status === 401) { showLogin(); throw new Error("Unauthorized"); }
    if (!resp.ok || !resp.body) {
      const j = await resp.json().catch(() => ({}));
      throw new Error(j.error || ("HTTP " + resp.status));
    }

    // Parse SSE from the fetch body
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
        let ev = "message", data = "";
        for (const line of raw.split("\n")) {
          if (line.startsWith("event: ")) ev = line.slice(7);
          else if (line.startsWith("data: ")) data += line.slice(6);
        }
        if (!data) continue;
        handleEvent(ev, JSON.parse(data));
      }
    }
  } catch (err) {
    note(String(err.message || err), "errorBox");
  } finally {
    streaming = false;
    $("send").disabled = false;
    refreshConvList();
    scrollDown();
  }

  function handleEvent(ev, d) {
    switch (ev) {
      case "meta":
        if (!currentConv) { currentConv = d.conversationId; refreshConvList(); }
        break;
      case "text":
        answerText += d.text;
        renderRich(ensureAnswer(), answerText);
        scrollDown();
        break;
      case "thinking":
        thinkText += d.text;
        ensureThink().textContent = thinkText;
        break;
      case "tool_start":
        chip("🔧 " + d.name);
        break;
      case "tool_result":
        if (!d.ok) chip("✗ " + d.name, "bad");
        break;
      case "agent_start":
        chip("⚡ " + d.agent + " started", "agent");
        break;
      case "agent_tool":
        chip("⚡ " + d.agent + " → " + d.name, "agent");
        break;
      case "agent_done":
        chip("⚡ " + d.agent + (d.ok ? " done" : " failed"), d.ok ? "agent" : "bad");
        break;
      case "notice":
      case "agent_notice":
        note(d.text);
        break;
      case "refusal":
        note(d.text, "errorBox");
        break;
      case "error":
        note(d.text, "errorBox");
        break;
      case "done": {
        const u = d.usage || {};
        const n = document.createElement("div");
        n.className = "usage";
        n.textContent = "tokens: " + (u.input || 0) + " in / " + (u.output || 0) + " out" +
          (u.cacheRead ? " (+" + u.cacheRead + " cached)" : "") +
          (d.approxCostUSD != null ? "  ·  ~$" + d.approxCostUSD : "");
        body.appendChild(n);
        break;
      }
    }
  }
}
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

// ---------- boot ----------
(async () => {
  if (!token || !(await checkAuth())) showLogin();
  else refreshConvList();
})();
</script>
</body>
</html>
