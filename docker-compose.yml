services:
  video-studio:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
    # No hard CPU/memory caps by default, so this runs on any droplet size —
    # a `cpus:` value above the host's vCPU count is rejected on small droplets.
    # Generation runs on Replicate; this container only orchestrates + assembles
    # with ffmpeg, so it stays light. To cap resources on a bigger box, add e.g.
    # `mem_limit: 2g` and `cpus: 1.5` here (keep `cpus` <= your vCPU count).
